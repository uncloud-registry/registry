# Gitleaks configuration for the Uncloud Registry repository.
#
# Consumed by the Gitleaks engine when it is run (e.g. in CI); the enforced
# local gate (scripts/security/check-repository-secrets.sh) is deterministic
# and does not assume Gitleaks is installed.
#
# No whole-path allowlist is used: broad exclusions of README/docs/`*_test.go`
# create blind spots. If a benign repository fixture ever needs one, add a
# narrowly scoped fake-value regex / stopword / fingerprint instead.
[extend]
useDefault = true